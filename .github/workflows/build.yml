name: Build IPA (unsigned)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Chọn Xcode mới nhất
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)" && xcodebuild -version

      - name: Cài XcodeGen và sinh project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build (không ký)
        run: |
          xcodebuild build \
            -project TodoLock.xcodeproj \
            -scheme TodoLock \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            > build.log 2>&1 || true
          grep -E "^/.*: error:|BUILD (SUCCEEDED|FAILED)" build.log | sort -u | head -60
          grep -q "BUILD SUCCEEDED" build.log

      - name: Đóng gói .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/TodoLock.app Payload/
          zip -qry TodoLock-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: TodoLock-unsigned-ipa
          path: TodoLock-unsigned.ipa
