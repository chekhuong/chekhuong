# Dự án Xcode được sinh bằng XcodeGen:  brew install xcodegen && xcodegen generate
# CHỈ CẦN SỬA 2 DÒNG: APP_BUNDLE_ID (phải là duy nhất) và DEVELOPMENT_TEAM (Team ID của Apple ID bạn).
name: TodoLock
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    APP_BUNDLE_ID: com.chekhuong.todolock
    APP_GROUP_ID: group.$(APP_BUNDLE_ID)
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  TodoLock:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: TodoLock
        AppGroupID: $(APP_GROUP_ID)
        NSCalendarsFullAccessUsageDescription: TodoLock hiển thị sự kiện trong Lịch của bạn cùng với việc cần làm và trên widget màn hình khóa.
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleURLTypes:
          - CFBundleURLName: todolock
            CFBundleURLSchemes: [todolock]
    entitlements:
      path: App/TodoLock.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP_ID)
    dependencies:
      - target: TodoLockWidget
  TodoLockWidget:
    type: app-extension
    platform: iOS
    sources:
      - Widget
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).widget
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: TodoLock
        AppGroupID: $(APP_GROUP_ID)
        NSCalendarsFullAccessUsageDescription: Widget hiển thị sự kiện trong Lịch của bạn.
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/TodoLockWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP_ID)
schemes:
  TodoLock:
    build:
      targets:
        TodoLock: all
    run:
      config: Debug
    archive:
      config: Release
